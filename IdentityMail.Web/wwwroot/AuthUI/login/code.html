<!-- Interactive Header Decoration -->
<div class="relative w-full mb-lg overflow-hidden rounded-xl h-32 bg-gradient-to-br from-primary/10 via-surface-container-low to-secondary-container/20">
<div class="absolute inset-0 pointer-events-none" id="decoration-particles"><div class="absolute bg-primary/5 rounded-full blur-xl animate-pulse" style="width: 54.436px; height: 54.436px; left: 82.0697%; top: 88.6434%; animation-delay: 2.36046s; animation-duration: 7.86415s;"></div><div class="absolute bg-primary/5 rounded-full blur-xl animate-pulse" style="width: 33.3143px; height: 33.3143px; left: 10.3153%; top: 90.1776%; animation-delay: 1.92761s; animation-duration: 7.77274s;"></div><div class="absolute bg-primary/5 rounded-full blur-xl animate-pulse" style="width: 24.936px; height: 24.936px; left: 32.717%; top: 31.376%; animation-delay: 3.14591s; animation-duration: 7.11243s;"></div><div class="absolute bg-primary/5 rounded-full blur-xl animate-pulse" style="width: 47.3877px; height: 47.3877px; left: 68.8415%; top: 1.72399%; animation-delay: 3.71159s; animation-duration: 5.92252s;"></div><div class="absolute bg-primary/5 rounded-full blur-xl animate-pulse" style="width: 40.0335px; height: 40.0335px; left: 76.3756%; top: 7.64054%; animation-delay: 0.628811s; animation-duration: 4.59963s;"></div><div class="absolute bg-primary/5 rounded-full blur-xl animate-pulse" style="width: 35.6853px; height: 35.6853px; left: 87.3427%; top: 1.34496%; animation-delay: 3.97312s; animation-duration: 7.28222s;"></div></div>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center p-md">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Giriş Yap</h1>

</div>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-lg" id="loginForm" onsubmit="return false;">
<!-- Email Field -->
<div class="flex flex-col gap-base relative group">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs transition-colors group-focus-within:text-primary" for="email">E-posta Adresi</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full pl-xl pr-md py-sm bg-surface rounded-lg border-none focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface font-body-lg text-body-lg shadow-sm" id="email" name="email" placeholder="isim@sirket.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base relative group">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs transition-colors group-focus-within:text-primary" for="password">Şifre</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Şifremi Unuttum</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-xl pr-xl py-sm bg-surface rounded-lg border-none focus:ring-2 focus:ring-primary/20 transition-all outline-none text-on-surface font-body-lg text-body-lg shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-md text-outline hover:text-on-surface transition-colors flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="mt-md flex flex-col gap-md">
<button class="w-full py-sm bg-primary text-on-primary font-title-md text-title-md rounded-full shadow-md hover:shadow-lg hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs" id="submitBtn" type="submit">
<span class="">Giriş Yap</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>


</div>
<!-- Footer Links -->
<div class="text-center mt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
        Hesabınız yok mu? 
        <a class="text-primary font-semibold hover:underline" href="#">Kayıt Ol</a>
</p>
</div>
</form>
<script>
    // Micro-interaction: Password visibility toggle
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('passwordIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        input.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    // Micro-interaction: Subtle particle background
    const container = document.getElementById('decoration-particles');
    if (container) {
      for (let i = 0; i < 6; i++) {
        const particle = document.createElement('div');
        const size = Math.random() * 40 + 20;
        particle.className = 'absolute bg-primary/5 rounded-full blur-xl animate-pulse';
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = (Math.random() * 4) + 's';
        particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
        container.appendChild(particle);
      }
    }

    // Micro-interaction: Button loading state simulation
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const originalContent = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
      
      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.disabled = false;
        // In a real app, redirect or show error here
      }, 1500);
    });
  </script>
</div></div></div></main><footer class="p-lg text-center pb-safe"><p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Lüminans Mail © 2024</p></footer>
